<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Garçom · Churrasquinho da Praça</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d0a08;--card:#19120d;--line:#33261b;--ink:#f7efe4;--muted:#bba893;--gold:#f4b732;--fire:#ff6a1a;--ok:#3fbf6a;--red:#e5484d;--on:#211304;--serif:"Oswald","Arial Narrow",Impact,sans-serif;--sans:"Jost","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 16px;background:rgba(13,10,8,.95);border-bottom:1px solid var(--line);flex-wrap:wrap}
header img{height:46px}
header h1{font:700 24px var(--serif);text-transform:uppercase;margin:0;flex:1}
header h1 small{display:block;font:400 13px var(--sans);color:var(--muted);text-transform:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid transparent;font:600 16px var(--sans);cursor:pointer}
.btn.gold{background:var(--gold);color:var(--on)}
.btn.ok{background:var(--ok);color:#06210f}
.btn.ghost{background:transparent;border-color:#4a3a2b;color:var(--ink)}
.btn.red{background:transparent;border-color:rgba(229,72,77,.5);color:#ff9a9d}
.demo{margin:12px 16px 0;padding:10px 14px;border-radius:12px;border:1px dashed var(--gold);color:var(--gold);font-size:14px}
main{padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
section h2{font:600 18px var(--serif);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
section h2 b{background:var(--fire);color:#fff;border-radius:99px;padding:0 10px;font:600 14px/24px var(--sans)}
.list{display:grid;gap:12px}
.ped{padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--card);animation:in .4s ease}
.ped.novo{border-color:var(--fire);box-shadow:0 0 0 3px rgba(255,106,26,.25)}
@keyframes in{from{transform:translateY(-8px);opacity:0}}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mesa{font:700 40px/1 var(--serif);color:var(--gold);text-transform:uppercase}
.cod{color:var(--muted);font-size:14px}
.tempo{margin-left:auto;font-size:14px;color:var(--muted)}
.tempo.atraso{color:#ff9a9d;font-weight:600}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font:600 13px var(--sans);text-transform:uppercase;letter-spacing:.05em;background:#2c2016;color:var(--gold)}
.itens{list-style:none;padding:0;margin:12px 0;border-top:1px solid var(--line)}
.itens li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:18px}
.itens b{color:var(--gold);min-width:38px;font:700 22px var(--serif)}
.itens span{flex:1}
.itens small{color:var(--muted)}
.obs{padding:8px 12px;border-radius:10px;background:#2a1a10;color:#ffd2b0;margin-bottom:10px}
.cobrar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;color:var(--muted)}
.cobrar b{font:700 30px var(--serif);color:var(--ink)}
.alerta{padding:8px 12px;border-radius:10px;background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.4);color:#ffb3b5;font-size:14px;margin-bottom:10px}
.dica{padding:8px 12px;border-radius:10px;background:rgba(244,183,50,.1);border:1px solid rgba(244,183,50,.35);color:var(--gold);font-size:14px;margin-bottom:10px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts .btn{flex:1}
.vazio{color:var(--muted);padding:26px;text-align:center;border:1px dashed var(--line);border-radius:16px}
.login{max-width:360px;margin:12vh auto;padding:26px;border-radius:18px;border:1px solid var(--line);background:var(--card);display:grid;gap:12px}
.login h2{margin:0;font:700 26px var(--serif);text-transform:uppercase}
.login label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
.login input{height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#120d0a;color:var(--ink);font:16px var(--sans)}
.erro{color:#ff9a9d;font-size:14px;min-height:1.2em;margin:0}
body.cozinha .itens li{font-size:22px}
body.cozinha .itens b{font-size:26px}
@media(max-width:800px){main{grid-template-columns:1fr}}
</style>
</head>

const MODO = 'garcom';
const PRECOS = {"Carnes|Carne": 12.0, "Carnes|Carne com legumes": 12.0, "Carnes|Kafta": 10.0, "Carnes|Kafta com queijo": 15.0, "Carnes|Costela": 15.0, "Carnes|Picanha": 18.0, "Carnes|Coração": 12.0, "Carnes|Medalhão de carne": 15.0, "Frango|Frango": 10.0, "Frango|Medalhão de frango": 12.0, "Linguiças|Linguiça toscana": 10.0, "Linguiças|Linguiça apimentada caseira": 12.0, "Linguiças|Linguiça rúcula e queijo": 12.0, "Linguiças|Linguiça mostarda e mel": 12.0, "Linguiças|Linguiça 3 queijos": 12.0, "Porco|Panceta": 10.0, "Queijos e outros|Queijo coalho": 10.0, "Queijos e outros|Queijo provolone": 10.0, "Queijos e outros|Pão de alho": 8.0, "Queijos e outros|Medalhão de mandioca": 12.0, "Queijos e outros|Romeu e Julieta": 12.0, "Jantinha|Jantinha completa": 16.0, "Chopp|Chopp pilsen (2 unidades)": 10.0, "Cervejas lata|Skol": 5.0, "Cervejas lata|Brahma": 5.0, "Cervejas lata|Antarctica": 5.0, "Cervejas lata|Império": 5.0, "Cervejas lata|Original": 6.0, "Cervejas lata|Heineken": 7.0, "Cervejas lata|Amstel": 7.0, "Long neck|Heineken": 9.0, "Long neck|Corona": 10.0, "Long neck|Budweiser": 8.0, "Ice|Smirnoff Ice": 9.0, "Águas|Água sem gás": 3.0, "Águas|Água com gás": 4.0, "Refrigerante lata|Coca-Cola": 6.0, "Refrigerante lata|Coca-Cola zero": 6.0, "Refrigerante lata|Fanta laranja": 5.0, "Refrigerante lata|Fanta uva": 5.0, "Refrigerante lata|Sprite": 5.0, "Refrigerante lata|Guaraná Antarctica": 5.0, "Refrigerante 600 ml|Coca-Cola": 8.0, "Refrigerante 600 ml|Coca-Cola zero": 8.0, "Refrigerante 600 ml|Fanta laranja": 7.0, "Refrigerante 600 ml|Fanta uva": 7.0, "Refrigerante 600 ml|Guaraná Antarctica": 7.0, "Refrigerante 600 ml|Sprite": 7.0, "Refrigerante 1 L|Guaraná Antarctica": 10.0, "Refrigerante 1 L|Coca-Cola": 12.0, "Refrigerante 1 L|Coca-Cola zero": 12.0, "Sucos|Suco natural de laranja 1 L": 15.0, "Sucos|Del Valle lata": 6.0, "Energéticos|Monster": 13.0, "Energéticos|Red Bull": 13.0};
/* ---------- banco de pedidos ----------
   Com FIREBASE preenchido, usa o Firestore (tempo real entre celulares).
   Sem ele, roda em modo demonstração: os pedidos ficam só neste navegador
   (abra o site, o painel do garçom e o da cozinha em abas do mesmo navegador). */
const FIREBASE = {"apiKey": "AIzaSyDilG9T9PxMbv2Hn3PouL0NrUTtSArX3L0", "authDomain": "churrasquinho-da-praca-1bd46.firebaseapp.com", "projectId": "churrasquinho-da-praca-1bd46", "storageBucket": "churrasquinho-da-praca-1bd46.firebasestorage.app", "messagingSenderId": "542190749595", "appId": "1:542190749595:web:94f3071f8d53516167033e"};
const DEMO = !FIREBASE;
const STATUS = ['aguardando_pagamento', 'pago', 'preparando', 'pronto', 'entregue', 'cancelado'];
const codigoDe = id => id.slice(-4).toUpperCase();
const DB = (() => {
  if (!DEMO) {
    firebase.initializeApp(FIREBASE);
    const fs = firebase.firestore(), col = fs.collection('pedidos'), ts = () => firebase.firestore.FieldValue.serverTimestamp();
    const doc = d => { const x = d.data(); return {id:d.id, ...x, criado:x.criado ? x.criado.toMillis() : Date.now()}; };
    return {
      novoId: () => col.doc().id,
      criar: (id, p) => col.doc(id).set({...p, status:'aguardando_pagamento', criado:ts()}),
      ouvirUm: (id, cb) => col.doc(id).onSnapshot(d => cb(d.exists ? doc(d) : null), () => cb(null)),
      ouvir: (lista, cb, erro) => col.where('status', 'in', lista).onSnapshot(s => cb(s.docs.map(doc)), erro),
      mudar: (id, status, extra) => col.doc(id).update({...(extra || {}), status, ['em_' + status]:ts()}),
      auth: firebase.auth(),
    };
  }
  const K = 'cdp_pedidos', ler = () => { try { return JSON.parse(localStorage.getItem(K)) || {}; } catch (e) { return {}; } };
  const subs = new Set(), avisa = () => subs.forEach(f => f());
  const grava = o => { try { localStorage.setItem(K, JSON.stringify(o)); } catch (e) {} avisa(); };
  addEventListener('storage', e => { if (e.key === K) avisa(); });
  const ouvirF = f => { subs.add(f); f(); return () => subs.delete(f); };
  return {
    novoId: () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36),
    criar: async (id, p) => { const o = ler(); o[id] = {...p, status:'aguardando_pagamento', criado:Date.now()}; grava(o); },
    ouvirUm: (id, cb) => ouvirF(() => { const p = ler()[id]; cb(p ? {id, ...p} : null); }),
    ouvir: (lista, cb) => ouvirF(() => cb(Object.entries(ler()).map(([id, p]) => ({id, ...p})).filter(p => lista.includes(p.status)))),
    mudar: async (id, status, extra) => { const o = ler(); if (o[id]) { o[id] = {...o[id], ...(extra || {}), status, ['em_' + status]:Date.now()}; grava(o); } },
    auth: null,
  };
})();

const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const brl = v => 'R$ ' + (+v).toFixed(2).replace('.', ',');
const FORMA = {pix:'Pix', credito:'Crédito', debito:'Débito'};

// colunas de cada painel: [título, status mostrados, botões]
const COLS = MODO === 'garcom' ? [
  ['Aguardando pagamento', ['aguardando_pagamento'], p => [['ok', p.forma === 'pix' ? 'Pix recebido' : 'Pago na maquininha', 'pago'], ['red', 'Cancelar', 'cancelado']]],
  ['Prontos para levar', ['pronto'], p => [['gold', 'Entregue na mesa', 'entregue']]],
] : [
  ['Novos (já pagos)', ['pago'], p => [['gold', 'Começar', 'preparando']]],
  ['Na brasa', ['preparando'], p => [['ok', 'Pronto', 'pronto']]],
];
const AVISAR = COLS[0][1]; // novos pedidos nessa coluna tocam o som

/* som de aviso (o navegador só deixa tocar depois de um toque na tela) */
let audio = null;
const somBtn = document.getElementById('som');
somBtn.addEventListener('click', () => { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); somBtn.textContent = 'Som ligado'; somBtn.disabled = true; bip(); });
function bip() {
  if (!audio) return;
  [0, .18].forEach(d => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audio.destination); g.gain.setValueAtTime(.0001, audio.currentTime + d); g.gain.exponentialRampToValueAtTime(.4, audio.currentTime + d + .02); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + d + .15); o.start(audio.currentTime + d); o.stop(audio.currentTime + d + .16); });
}

/* confere o valor com a tabela de preços (evita pedido com preço alterado) */
function confere(p) {
  let certo = 0, desconhecido = false;
  (p.itens || []).forEach(i => { const v = PRECOS[i.k]; if (v == null) desconhecido = true; else certo += v * i.qn; });
  return {certo, ok:!desconhecido && Math.abs(certo - (p.total || 0)) < .01, desconhecido};
}
const minutos = t => Math.max(0, Math.floor((Date.now() - t) / 60000));
function card(p, botoes) {
  const c = confere(p), desde = p['em_' + p.status] || p.criado, m = minutos(desde);
  const valor = MODO === 'garcom' ? '<div class="cobrar"><span>Cobrar · <span class="badge">' + (FORMA[p.forma] || p.forma) + '</span></span><b>' + brl(c.ok ? p.total : c.certo) + '</b></div>' + (p.forma === 'pix' && p.status === 'aguardando_pagamento' ? '<div class="dica">Confira no app do banco se o Pix de ' + brl(c.ok ? p.total : c.certo) + ' caiu antes de confirmar.</div>' : '') + (c.ok ? '' : '<div class="alerta">' + (c.desconhecido ? 'Tem item que não está no cardápio. Confira com o cliente.' : 'O valor do pedido não bate com o cardápio. Cobre ' + brl(c.certo) + '.') + '</div>') : '';
  return '<article class="ped' + (novos.has(p.id) ? ' novo' : '') + '"><div class="top"><span class="mesa">Mesa ' + esc(p.mesa) + '</span><span class="cod">#' + esc(p.codigo || '') + (p.nome ? ' · ' + esc(p.nome) : '') + '</span><span class="tempo' + (m >= 15 ? ' atraso' : '') + '">' + (m ? 'há ' + m + ' min' : 'agora') + '</span></div>' +
    '<ul class="itens">' + (p.itens || []).map(i => '<li><b>' + i.qn + 'x</b><span>' + esc(i.nm) + '</span></li>').join('') + '</ul>' +
    (p.obs ? '<div class="obs">Obs.: ' + esc(p.obs) + '</div>' : '') + valor +
    '<div class="acts">' + botoes(p).map(([cls, txt, st]) => '<button class="btn ' + cls + '" data-id="' + p.id + '" data-st="' + st + '">' + txt + '</button>').join('') + '</div></article>';
}

let ultimo = [], vistos = null; const novos = new Set();
function desenha(lista) {
  ultimo = lista;
  const ids = new Set(lista.filter(p => AVISAR.includes(p.status)).map(p => p.id));
  if (vistos) { let tem = false; ids.forEach(id => { if (!vistos.has(id)) { novos.add(id); tem = true; setTimeout(() => { novos.delete(id); desenha(ultimo); }, 20000); } }); if (tem) bip(); }
  vistos = ids;
  COLS.forEach(([titulo, sts, botoes], i) => {
    const ps = lista.filter(p => sts.includes(p.status)).sort((a, b) => (a['em_' + a.status] || a.criado) - (b['em_' + b.status] || b.criado));
    document.getElementById('t' + (i + 1)).innerHTML = esc(titulo) + (ps.length ? ' <b>' + ps.length + '</b>' : '');
    document.getElementById('c' + (i + 1)).innerHTML = ps.length ? ps.map(p => card(p, botoes)).join('') : '<div class="vazio">Nenhum pedido aqui.</div>';
  });
  document.title = (lista.filter(p => AVISAR.includes(p.status)).length || '') + ' Garçom · Churrasquinho da Praça';
}
setInterval(() => desenha(ultimo), 30000); // atualiza os minutos

document.getElementById('app').addEventListener('click', async e => {
  const b = e.target.closest('button[data-st]'); if (!b) return;
  const st = b.dataset.st;
  if (st === 'cancelado' && !confirm('Cancelar este pedido?')) return;
  b.disabled = true;
  try { await DB.mudar(b.dataset.id, st); } catch (err) { b.disabled = false; alert('Não deu para atualizar. Verifique a internet.'); }
});

let parar = null;
function comecar() {
  document.getElementById('app').hidden = false; document.getElementById('login').hidden = true;
  const todos = [...new Set(COLS.flatMap(c => c[1]))];
  parar = DB.ouvir(todos, desenha, () => { document.getElementById('sub').textContent = 'Sem permissão para ver os pedidos. Entre com a conta da equipe.'; });
}
if (DEMO) { document.getElementById('demo').hidden = new URLSearchParams(location.search).has('embed'); comecar(); }
else {
  const login = document.getElementById('login'), erro = document.getElementById('erro'), sair = document.getElementById('sair');
  DB.auth.onAuthStateChanged(u => {
    if (u) { sair.hidden = false; if (!parar) comecar(); }
    else { if (parar) { parar(); parar = null; } sair.hidden = true; document.getElementById('app').hidden = true; login.hidden = false; }
  });
  login.addEventListener('submit', async e => {
    e.preventDefault(); erro.textContent = '';
    try { await DB.auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(), document.getElementById('senha').value); }
    catch (err) { erro.textContent = 'E-mail ou senha errados.'; }
  });
  sair.addEventListener('click', () => DB.auth.signOut());
}
}
</script>
